[project]
name = "cfd-drag"
version = "0.1.0"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cfd_drag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running physics validation (deselect with -m 'not slow')"]
